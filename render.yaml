# Render 一鍵部署設定（免費方案可跑）。
# 用法：把這個 repo 連到 Render → New → Blueprint → 選這個 repo → 填入 DATABASE_URL。
#
# 資料永久保存：兩個 App 共用同一個 Supabase 免費 Postgres 專案，
# 以不同 schema 隔離（salesapp / stocktake）。
#
# 你只需要：
#   1. 到 Supabase Dashboard → 專案 kxgbnrbedmmgfxuevuzq → Settings → Database
#      → Connection string → Pooling → "Transaction" 模式 → 複製 URI。
#      （格式：postgresql://postgres.[ref]:[密碼]@...pooler.supabase.com:6543/postgres）
#   2. 把同一條 URI 分別貼到下方兩個服務的 DATABASE_URL（URI 一模一樣，DB_SCHEMA 不同）。
#   3. 部署，完成。
services:
  - type: web
    name: sales-invoice
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /login
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DB_SCHEMA
        value: salesapp            # 對應 Supabase 已建好的 salesapp schema
      - key: DATABASE_URL
        sync: false                # ← 在 Render 後台貼上 Supabase 連線字串
      # - key: ANTHROPIC_API_KEY
      #   sync: false

  - type: web
    name: stocktake
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run_stocktake:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /login
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DB_SCHEMA
        value: stocktake           # 對應 Supabase 已建好的 stocktake schema
      - key: DATABASE_URL
        sync: false                # ← 在 Render 後台貼上同一條 Supabase 連線字串
      - key: SOURCE_SHEET_ID
        value: 1JOpCUfAS3YEHHGUq_NR8twxGzDh7C0_p7bZAdOc0tf0
      - key: DEDICATED_SHEET_ID
        value: 1-t5dPhduceaVwVk3vtoestXPOKR6_yk9xHKCtiS-Ipc
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
